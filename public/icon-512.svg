<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a" />
      <stop offset="40%" stop-color="#0e1629" />
      <stop offset="100%" stop-color="#142038" />
    </linearGradient>
    <linearGradient id="gold512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Full bleed background for maskable and regular -->
  <rect width="512" height="512" rx="110" fill="url(#bg512)" stroke="#233152" stroke-width="6" />
  
  <!-- Sacred Geometric Radiant Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gold512)" stroke-width="4" stroke-dasharray="8,12" opacity="0.35" />
  <circle cx="256" cy="256" r="155" fill="#11192e" stroke="url(#gold512)" stroke-width="6" opacity="0.85" />
  
  <!-- Sacred Om Symbol -->
  <text x="256" y="338" font-size="220" text-anchor="middle" fill="url(#gold512)" font-family="sans-serif" font-weight="bold" filter="url(#glow512)">🕉</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a" />
      <stop offset="50%" stop-color="#0e1629" />
      <stop offset="100%" stop-color="#142038" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with rounded edges -->
  <rect width="192" height="192" rx="42" fill="url(#bg)" stroke="#233152" stroke-width="3" />
  
  <!-- Radiant Ring -->
  <circle cx="96" cy="96" r="70" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="4,6" opacity="0.4" />
  <circle cx="96" cy="96" r="58" fill="#11192e" stroke="url(#gold)" stroke-width="2.5" opacity="0.8" />
  
  <!-- Sacred Om Symbol -->
  <text x="96" y="126" font-size="80" text-anchor="middle" fill="url(#gold)" font-family="sans-serif" font-weight="bold" filter="url(#glow)">🕉</text>
</svg>

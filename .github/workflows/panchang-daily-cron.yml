name: Panchang Daily Morning & Tithi Notification Scheduler

on:
  schedule:
    # Runs every 15 minutes to catch local sunrises and exact Tithi transitions across all timezones
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-panchang-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Panchang Scheduler API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          PROD_URL="https://dailytithi.com/api/push/daily-trigger"
          echo "Triggering Panchang Scheduler on $PROD_URL"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$PROD_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -d '{"source": "github-actions-cron"}')
          echo "Server Response:"
          echo "$RESPONSE"

name: Panchang Daily Morning & Tithi Notification Scheduler

on:
  schedule:
    # Runs every 10-15 minutes to catch local sunrises and exact Tithi transitions across all timezones
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-panchang-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Panchang Scheduler API
        run: |
          PROD_URL="https://vikram-samvat-widget.vercel.app/api/push/daily-trigger"
          echo "Triggering Panchang Scheduler on $PROD_URL"
          curl -s -X POST "$PROD_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -d '{"source": "github-actions-cron"}' || true
